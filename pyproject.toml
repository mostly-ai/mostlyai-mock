[project]
name = "mostlyai-mock"
version = "0.3.2"
description = "Synthetic Mock Data"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=1.26.3",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "litellm>=1.83.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
litellm-proxy = [
    "litellm[proxy]>=1.83.0",
]
mcp = [
    "fastmcp>=3.0.0,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",  # sync'ed with .pre-commit-config
    "prek>=0.5.12",
    "ty==0.0.112",  # pinned: ty is pre-1.0 and diagnostics change between releases
    "twine>=6.1",
    "ipykernel>=6.25",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[crystal, python]>=0.29",
    # mkdocstrings-python 2.x expects griffe 2 / griffelib; handler still imports legacy `griffe` API.
    "mkdocstrings-python>=1.16.2,<3",
    "mkdocs-material>=9.0",
    "mkdocs-llmstxt>=0.2",
    "griffe>=1.13,<3",
    "pymdown-extensions>=10.0",
    "griffe-fieldz>=0.2,<0.6",
    "black>=25.0",
]

[project.scripts]
mcp-server = "mostlyai.mock.mcp_server:main"

[project.urls]
homepage = "https://github.com/mostly-ai/mostlyai-mock"
repository = "https://github.com/mostly-ai/mostlyai-mock"
issues = "https://github.com/mostly-ai/mostlyai-mock/issues"
documentation = "https://mostly-ai.github.io/mostlyai-mock/"

[tool.uv]
default-groups = ["dev", "docs"]
conflicts = [
    [
        # fastmcp and litellm[proxy] have conflicting dependencies
        { extra = "litellm-proxy" },
        { extra = "mcp" },
    ]
]

[tool.hatch.build.targets.sdist]
include = ["mostlyai/mock"]

[tool.hatch.build.targets.wheel]
include = ["mostlyai/mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP"]
# keep public `str, Enum` classes (StrEnum changes str()/format() behavior)
ignore = ["UP042"]

[tool.ty.src]
include = ["mostlyai"]

[tool.ty.analysis]
# optional extra `mcp` is not installed in CI
allowed-unresolved-imports = ["fastmcp"]
